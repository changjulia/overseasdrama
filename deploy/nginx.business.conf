# Install alongside existing Nginx sites after Caddy has obtained this certificate.
server {
    listen 80;
    server_name lumina.43-134-182-192.sslip.io;
    location / {
        proxy_pass http://127.0.0.1:3280;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
server {
    listen 443 ssl;
    server_name lumina.43-134-182-192.sslip.io;
    ssl_certificate /var/lib/docker/volumes/lumina-business_caddy_data/_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/lumina.43-134-182-192.sslip.io/lumina.43-134-182-192.sslip.io.crt;
    ssl_certificate_key /var/lib/docker/volumes/lumina-business_caddy_data/_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/lumina.43-134-182-192.sslip.io/lumina.43-134-182-192.sslip.io.key;
    client_max_body_size 4G;
    location / {
        proxy_pass https://127.0.0.1:32443;
        proxy_ssl_server_name on;
        proxy_ssl_name lumina.43-134-182-192.sslip.io;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
